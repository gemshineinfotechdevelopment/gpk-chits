# ==============================================================================
# Nginx Configuration for GPK Crackers (Chit Scheme Platform)
# Domain: gpk-chits.gemshine.tech
# Backend Port: 5033
# Path on VPS: /etc/nginx/sites-available/gpk-chits.gemshine.tech.conf
# ==============================================================================

# Rate limiting zone for API protection
limit_req_zone $binary_remote_addr zone=gpk_api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;

    # Primary domain for GPK Chit Scheme
    server_name gpk-chits.gemshine.tech;

    # Root directory pointing to Vite's production build
    root /var/www/gpk-chits/dist;
    index index.html;

    # Maximum file upload size for scheme promotional posters
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression for Fast Page Loads
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # 1. API Reverse Proxy -> Node.js Backend Server (Port 5033)
    location /api/ {
        limit_req zone=gpk_api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5033;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
    }

    # 2. Static Assets Caching (Vite fingerprinted JS/CSS in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 3. Static Media & Images Caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 4. Strictly block /admin at server level (redirects to /chit-scheme)
    location = /admin {
        return 301 /chit-scheme;
    }
    location ^~ /admin/ {
        return 301 /chit-scheme;
    }

    # 5. Ensure index.html is NEVER cached so new builds apply immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # 6. React Single Page Application (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 7. Deny Access to Hidden Files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/gpk-chits-access.log;
    error_log /var/log/nginx/gpk-chits-error.log warn;
}
